name: Build Xunison D50 5G v2rayA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget curl jq

      - name: Add Custom Feeds and Fix Version Constraints
        run: |
          grep -q "Modem-extras" feeds.conf.default || echo "src-git iceg https://github.com/4IceG/Modem-extras.git" >> feeds.conf.default
          grep -q "modemfeed" feeds.conf.default || echo "src-git modemfeed https://github.com/koshev-msk/modemfeed.git" >> feeds.conf.default
          ./scripts/feeds update -a
          find feeds/ -name "CMakeLists.txt" -exec sed -i 's/3\.31/3.30/g; s/3\.32/3.30/g' {} +
          find feeds/luci/ package/ -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/ucode (>=[^)]*)/ucode/g' {} +
          ./scripts/feeds install -a

      - name: Extract Custom Hardware Files Safely
        run: |
          rm -rf files
          mkdir -p files
          tar -xzvf d50_ready_files.tar.gz -C files/
          rm -f files/etc/modem/atcmmds.user \
                files/etc/modem/atinoutatcommands.user \
                files/etc/modem/log.txt \
                files/etc/modem/modemlist.json \
                files/etc/modem/phonebook.user \
                files/etc/modem/ussdcodes.user
          chmod -R +x files/etc/init.d/ \
            files/etc/uci-defaults/ \
            files/usr/bin/ \
            files/usr/sbin/ \
            files/usr/share/xunison/ \
            files/lib/netifd/proto/

      - name: Configure Clean Build
        run: |
          rm -f .config
          cat << 'EOF' > .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xunison_exigo-hub-d50-5g=y
          CONFIG_DEVEL=y
          CONFIG_KERNEL_DEVMEM=y

          CONFIG_PACKAGE_ipq-wifi-xunison_exigo-hub-d50-5g=y
          CONFIG_PACKAGE_ath11k-firmware-ipq5018=y
          CONFIG_PACKAGE_ath11k-firmware-qcn9074=y
          CONFIG_PACKAGE_kmod-ath11k=y
          CONFIG_PACKAGE_kmod-ath11k-ahb=y
          CONFIG_PACKAGE_kmod-ath11k-pci=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y

          CONFIG_PACKAGE_v2raya=y
          CONFIG_PACKAGE_luci-app-v2raya=y
          CONFIG_PACKAGE_luci-i18n-v2raya-ar=y
          CONFIG_PACKAGE_xray-core=y
          # CONFIG_PACKAGE_v2ray-geoip is not set
          # CONFIG_PACKAGE_v2ray-geosite is not set

          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_kmod-nf-socket=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_kmod-zram=y
          CONFIG_PACKAGE_kmod-lib-lz4=y

          CONFIG_PACKAGE_kmod-pcie_mhi=y
          CONFIG_PACKAGE_kmod-mhi-bus=y
          CONFIG_PACKAGE_kmod-mhi-net=y
          CONFIG_PACKAGE_kmod-qrtr=y
          CONFIG_PACKAGE_kmod-qrtr-mhi=y
          CONFIG_PACKAGE_kmod-qcom-qmi-helpers=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
          CONFIG_PACKAGE_kmod-usb-acm=y
          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_atinout=y
          CONFIG_PACKAGE_modemband=y
          CONFIG_PACKAGE_modemdata=y
          CONFIG_PACKAGE_sms-tool=y
          CONFIG_PACKAGE_qfirehose=y
          CONFIG_PACKAGE_luci-app-atinout=y
          CONFIG_PACKAGE_luci-app-modemband=y
          CONFIG_PACKAGE_luci-app-modemdata=y
          CONFIG_PACKAGE_luci-app-sms-tool-js=y
          CONFIG_PACKAGE_luci-app-lite-watchdog=y
          CONFIG_PACKAGE_luci-app-qfirehose=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-i18n-base-ar=y
          CONFIG_PACKAGE_luci-theme-fluent=y
          CONFIG_PACKAGE_luci-app-filemanager=y
          CONFIG_PACKAGE_luci-app-commands=y
          CONFIG_PACKAGE_luci-app-cpu-status=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_uboot-envtools=y
          EOF
          make defconfig
          grep -E "CONFIG_PACKAGE_(v2raya|xray-core|kmod-nft-tproxy|zram-swap)" .config

      - name: Download Packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          export LD_LIBRARY_PATH="$PWD/staging_dir/host/lib:$PWD/staging_dir/hostpkg/lib:$LD_LIBRARY_PATH"
          make -j$(nproc) || make -j1 V=s

      - name: Verify Output Size and Packages
        run: |
          ls -lh bin/targets/qualcommax/ipq50xx/
          grep -E "v2raya|xray-core|kmod-nft-tproxy|zram-swap" bin/targets/qualcommax/ipq50xx/*.manifest

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xunison-D50-5G-v2rayA-Firmware
          path: |
            bin/targets/qualcommax/ipq50xx/*sysupgrade.bin
            bin/targets/qualcommax/ipq50xx/*factory.ubi
            bin/targets/qualcommax/ipq50xx/*.manifest
