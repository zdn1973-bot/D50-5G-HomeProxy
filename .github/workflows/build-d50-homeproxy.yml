name: Build D50 5G HomeProxy

on:
  workflow_dispatch:
  push:
    branches:
      - d50-homeproxy-2024031600

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout custom source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save D50 custom overlay
        run: |
          mkdir -p /tmp/d50-overlay
          cp -a custom-packages configs /tmp/d50-overlay/
          mkdir -p /tmp/d50-overlay/target/linux/qualcommax/image
          cp target/linux/qualcommax/image/ipq50xx.mk target/linux/qualcommax/image/xunison_exigo-hub-d50-5g.bootscript /tmp/d50-overlay/target/linux/qualcommax/image/
          mkdir -p /tmp/d50-overlay/target/linux/qualcommax/ipq50xx/base-files/etc/board.d
          mkdir -p /tmp/d50-overlay/target/linux/qualcommax/ipq50xx/base-files/etc/hotplug.d/firmware
          mkdir -p /tmp/d50-overlay/target/linux/qualcommax/ipq50xx/base-files/lib/upgrade
          cp target/linux/qualcommax/ipq50xx/base-files/etc/board.d/02_network /tmp/d50-overlay/target/linux/qualcommax/ipq50xx/base-files/etc/board.d/
          cp target/linux/qualcommax/ipq50xx/base-files/etc/hotplug.d/firmware/11-ath11k-caldata /tmp/d50-overlay/target/linux/qualcommax/ipq50xx/base-files/etc/hotplug.d/firmware/
          cp target/linux/qualcommax/ipq50xx/base-files/lib/upgrade/platform.sh /tmp/d50-overlay/target/linux/qualcommax/ipq50xx/base-files/lib/upgrade/
          mkdir -p /tmp/d50-overlay/package/firmware/ipq-wifi
          cp package/firmware/ipq-wifi/Makefile /tmp/d50-overlay/package/firmware/ipq-wifi/

      - name: Switch to exact working OpenWrt base
        run: |
          git fetch --no-tags origin 88dcd8c303b688b344c8f22c24df6a49f6b6b707
          git checkout --detach 88dcd8c303b688b344c8f22c24df6a49f6b6b707
          grep -E '^KERNEL_PATCHVER:=' target/linux/qualcommax/Makefile

      - name: Restore D50 overlay
        run: |
          cp -a /tmp/d50-overlay/custom-packages /tmp/d50-overlay/configs .
          cp -a /tmp/d50-overlay/target/linux/qualcommax/image/* target/linux/qualcommax/image/
          cp -a /tmp/d50-overlay/target/linux/qualcommax/ipq50xx/base-files/etc/board.d/02_network target/linux/qualcommax/ipq50xx/base-files/etc/board.d/
          cp -a /tmp/d50-overlay/target/linux/qualcommax/ipq50xx/base-files/etc/hotplug.d/firmware/11-ath11k-caldata target/linux/qualcommax/ipq50xx/base-files/etc/hotplug.d/firmware/
          cp -a /tmp/d50-overlay/target/linux/qualcommax/ipq50xx/base-files/lib/upgrade/platform.sh target/linux/qualcommax/ipq50xx/base-files/lib/upgrade/
          cp -a /tmp/d50-overlay/package/firmware/ipq-wifi/Makefile package/firmware/ipq-wifi/

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl subversion xsltproc time bc bzip2 patch perl device-tree-compiler u-boot-tools

      - name: Extract exact D50 DTS from known-good firmware
        env:
          OFFICIAL_FACTORY_URL: https://github.com/4IceG/Xunison-Exigo-Hub-D50-5G/releases/download/r36066-88dcd8c303/openwrt-qualcommax-ipq50xx-xunison_exigo-hub-d50-5g-squashfs-factory.img
        run: |
          curl -fL "$OFFICIAL_FACTORY_URL" -o /tmp/d50-reference-factory.img
          echo "e74e43e9962073bf4f01dbb49779d418542c7fd9179d19941f8fd7bcdf1bfd19  /tmp/d50-reference-factory.img" | sha256sum -c -
          python3 - <<'PY'
          import struct
          p='/tmp/d50-reference-factory.img'
          b=open(p,'rb').read()
          hits=[]; pos=1024*1024
          while True:
              pos=b.find(b'\xd0\x0d\xfe\xed',pos)
              if pos < 0: break
              if pos+8 <= len(b):
                  size=struct.unpack('>I',b[pos+4:pos+8])[0]
                  if 20000 <= size <= 100000 and b[pos:pos+size].find(b'xunison,exigo-hub-d50-5g') >= 0 and b[pos:pos+size].find(b'ethernet@39c00000') >= 0 and b[pos:pos+size].find(b'ethernet@39d00000') >= 0:
                      hits.append((pos,size))
              pos += 4
          if not hits: raise SystemExit('D50 board DTB not found')
          off,size=hits[0]
          print(f'D50 board DTB offset={off} size={size}')
          open('/tmp/d50-board.dtb','wb').write(b[off:off+size])
          PY
          dtc -I dtb -O dts -o target/linux/qualcommax/dts/ipq5018-exigo-hub-d50-5g.dts /tmp/d50-board.dtb
          grep -E 'model =|compatible =|ethernet@39c00000|ethernet@39d00000|bootargs' target/linux/qualcommax/dts/ipq5018-exigo-hub-d50-5g.dts || true

      - name: Add TPROXY/socket support to 6.18
        run: |
          cat >> target/linux/qualcommax/config-6.18 <<'EOF'

          # Legacy HomeProxy TPROXY/socket support
          CONFIG_NF_TPROXY_IPV4=m
          CONFIG_NF_TPROXY_IPV6=m
          CONFIG_NETFILTER_XT_TARGET_TPROXY=m
          CONFIG_NF_SOCKET_IPV4=m
          CONFIG_NF_SOCKET_IPV6=m
          CONFIG_NETFILTER_XT_MATCH_SOCKET=m
          CONFIG_NFT_SOCKET=m
          CONFIG_NFT_TPROXY=m
          EOF

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace feed packages with pinned legacy versions
        run: |
          rm -rf feeds/packages/net/sing-box package/feeds/packages/sing-box
          rm -rf feeds/luci/applications/luci-app-homeproxy package/feeds/luci/luci-app-homeproxy
          rm -rf feeds/packages/net/chinadns-ng package/feeds/packages/chinadns-ng package/chinadns-ng
          cp -a custom-packages/sing-box package/sing-box
          cp -a custom-packages/luci-app-homeproxy package/luci-app-homeproxy
          cp -a custom-packages/chinadns-ng package/chinadns-ng

      - name: Configure D50
        run: |
          cp configs/d50-homeproxy.config .config
          make defconfig

      - name: Force legacy HomeProxy package selections after defconfig
        run: |
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_kmod-nf-conntrack=y
          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_kmod-nf-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_ca-bundle=y
          EOF
          grep -E '^CONFIG_(TARGET_qualcommax|TARGET_qualcommax_ipq50xx|TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_)' .config
          grep '^KERNEL_PATCHVER:=' target/linux/qualcommax/Makefile
          grep -E '^CONFIG_PACKAGE_(luci-app-homeproxy|sing-box|kmod-nft-tproxy|kmod-nft-socket|kmod-tun|chinadns-ng)=' .config
          grep -E '^CONFIG_(NF_TPROXY_IPV4|NF_TPROXY_IPV6|NETFILTER_XT_TARGET_TPROXY|NF_SOCKET_IPV4|NF_SOCKET_IPV6|NETFILTER_XT_MATCH_SOCKET|NFT_SOCKET|NFT_TPROXY)=' target/linux/qualcommax/config-6.18
          test "$(grep -c '^CONFIG_TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_xunison_exigo-hub-d50-5g=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_luci-app-homeproxy=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_sing-box=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_kmod-nft-tproxy=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_kmod-nft-socket=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_NFT_TPROXY=m' target/linux/qualcommax/config-6.18)" -eq 1
          grep -E 'ethernet@39c00000|ethernet@39d00000' target/linux/qualcommax/dts/ipq5018-exigo-hub-d50-5g.dts || true

      - name: Download sources
        run: |
          make download -j$(nproc)
          find dl -type f -size -1024c -print -delete

      - name: Build firmware
        run: make -j$(nproc) world V=s

      - name: Inspect firmware
        if: success()
        run: |
          file bin/targets/qualcommax/ipq50xx/*factory* || true
          grep -a -m1 -E 'ARM64 OpenWrt Linux-6\.18\.44|ARM64 OpenWrt xunison' bin/targets/qualcommax/ipq50xx/*factory* || true
          find bin/targets/qualcommax/ipq50xx -maxdepth 1 -type f -printf '%f %k KB\n' | sort

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d50-homeproxy-6.18-${{ github.sha }}
          path: |
            bin/targets/qualcommax/ipq50xx/*factory*
            bin/targets/qualcommax/ipq50xx/*sysupgrade*
            bin/targets/qualcommax/ipq50xx/sha256sums
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: D50-build-failure-6.18-${{ github.sha }}
          path: |
            .config
            logs/
          if-no-files-found: ignore
          retention-days: 7
