name: Build D50 5G HomeProxy

on:
  workflow_dispatch:
  push:
    branches:
      - d50-homeproxy-2024031600

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout D50 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget \
            subversion xsltproc time bc bzip2 patch perl

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace feed packages with pinned legacy versions
        run: |
          rm -rf feeds/packages/net/sing-box
          rm -rf package/feeds/packages/sing-box
          rm -rf feeds/luci/applications/luci-app-homeproxy
          rm -rf package/feeds/luci/luci-app-homeproxy
          rm -rf package/chinadns-ng
          cp -a custom-packages/sing-box package/sing-box
          cp -a custom-packages/luci-app-homeproxy package/luci-app-homeproxy
          cp -a custom-packages/chinadns-ng package/chinadns-ng

      - name: Configure D50
        run: |
          cp configs/d50-homeproxy.config .config
          make defconfig

      - name: Verify target and TPROXY configuration
        run: |
          echo "=== TARGET ==="
          grep -E '^CONFIG_(TARGET_qualcommax|TARGET_qualcommax_ipq50xx|TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_)' .config || true
          echo "=== PROXY PACKAGES ==="
          grep -E '^CONFIG_PACKAGE_(luci-app-homeproxy|sing-box|kmod-nft-tproxy|kmod-nft-socket|kmod-tun|chinadns-ng)=' .config || true
          echo "=== KERNEL TPROXY CONFIG ==="
          grep -E '^CONFIG_(NF_TPROXY_IPV4|NF_TPROXY_IPV6|NETFILTER_XT_TARGET_TPROXY|NF_SOCKET_IPV4|NF_SOCKET_IPV6|NETFILTER_XT_MATCH_SOCKET|NFT_SOCKET|NFT_TPROXY)=' target/linux/qualcommax/config-6.12 || true
          test "$(grep -c '^CONFIG_TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_xunison_exigo-hub-d50-5g=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_.*=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_luci-app-homeproxy=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_sing-box=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_kmod-nft-tproxy=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_kmod-nft-socket=y' .config)" -eq 1
          test "$(grep -c '^CONFIG_NFT_TPROXY=m' target/linux/qualcommax/config-6.12)" -eq 1
          test "$(grep -c '^CONFIG_NF_TPROXY_IPV4=m' target/linux/qualcommax/config-6.12)" -eq 1
          test "$(grep -c '^CONFIG_NF_TPROXY_IPV6=m' target/linux/qualcommax/config-6.12)" -eq 1
          test "$(grep -c '^CONFIG_NETFILTER_XT_TARGET_TPROXY=m' target/linux/qualcommax/config-6.12)" -eq 1

      - name: Download sources
        run: |
          make download -j$(nproc)
          find dl -type f -size -1024c -print -delete

      - name: Build firmware
        run: |
          make -j$(nproc) world V=s

      - name: Show firmware
        if: success()
        run: |
          find bin/targets/qualcommax/ipq50xx -maxdepth 1 -type f -printf '%f %k KB\\n' | sort
          find bin/targets/qualcommax/ipq50xx -type f \( -name '*factory*' -o -name '*sysupgrade*' \) -print

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: |
            bin/targets/qualcommax/ipq50xx/*factory*
            bin/targets/qualcommax/ipq50xx/*sysupgrade*
            bin/targets/qualcommax/ipq50xx/sha256sums
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: D50-build-failure-${{ github.sha }}
          path: |
            .config
            logs/
          if-no-files-found: ignore
          retention-days: 7
