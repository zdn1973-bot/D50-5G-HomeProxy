name: Build D50 5G TPROXY kernel packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kmods:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout full OpenWrt history
        uses: actions/checkout@v4
        with:
          ref: d50-homeproxy-2024031600
          fetch-depth: 0

      - name: Verify exact OpenWrt base commit
        run: |
          set -eux
          BASE=88dcd8c303b688b344c8f22c24df6a49f6b6b707
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          echo "Verified OpenWrt base: $BASE"
          git show -s --format='%H%n%ad%n%s' "$BASE"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget \
            subversion xsltproc time bc bzip2 patch perl quilt

      - name: Configure exact D50 target
        run: |
          set -eux
          cp configs/d50-homeproxy.config .config

          sed -i \
            -e '/^CONFIG_PACKAGE_luci=/d' \
            -e '/^CONFIG_PACKAGE_luci-ssl=/d' \
            -e '/^CONFIG_PACKAGE_luci-app-homeproxy=/d' \
            -e '/^CONFIG_PACKAGE_sing-box=/d' \
            -e '/^CONFIG_PACKAGE_chinadns-ng=/d' \
            -e '/^CONFIG_PACKAGE_unzip=/d' \
            -e '/^CONFIG_PACKAGE_firewall4=/d' \
            -e '/^CONFIG_PACKAGE_nftables-json=/d' \
            -e '/^CONFIG_PACKAGE_ca-bundle=/d' \
            -e '/^CONFIG_PACKAGE_kmod-inet-diag=/d' \
            -e '/^CONFIG_PACKAGE_kmod-tun=/d' .config

          cat >> .config <<'EOF'
CONFIG_PACKAGE_kmod-nf-conntrack=y
CONFIG_PACKAGE_kmod-nf-tproxy=y
CONFIG_PACKAGE_kmod-nf-socket=y
CONFIG_PACKAGE_kmod-nft-tproxy=y
CONFIG_PACKAGE_kmod-nft-socket=y
EOF

          make defconfig

      - name: Enable TPROXY kernel options
        run: |
          set -eux
          CFG=target/linux/qualcommax/config-6.12

          grep -q '^CONFIG_NF_TPROXY_IPV4=' "$CFG" || echo 'CONFIG_NF_TPROXY_IPV4=m' >> "$CFG"
          grep -q '^CONFIG_NF_TPROXY_IPV6=' "$CFG" || echo 'CONFIG_NF_TPROXY_IPV6=m' >> "$CFG"
          grep -q '^CONFIG_NETFILTER_XT_TARGET_TPROXY=' "$CFG" || echo 'CONFIG_NETFILTER_XT_TARGET_TPROXY=m' >> "$CFG"
          grep -q '^CONFIG_NF_SOCKET_IPV4=' "$CFG" || echo 'CONFIG_NF_SOCKET_IPV4=m' >> "$CFG"
          grep -q '^CONFIG_NF_SOCKET_IPV6=' "$CFG" || echo 'CONFIG_NF_SOCKET_IPV6=m' >> "$CFG"
          grep -q '^CONFIG_NETFILTER_XT_MATCH_SOCKET=' "$CFG" || echo 'CONFIG_NETFILTER_XT_MATCH_SOCKET=m' >> "$CFG"
          grep -q '^CONFIG_NFT_SOCKET=' "$CFG" || echo 'CONFIG_NFT_SOCKET=m' >> "$CFG"
          grep -q '^CONFIG_NFT_TPROXY=' "$CFG" || echo 'CONFIG_NFT_TPROXY=m' >> "$CFG"

          echo '=== TARGET ==='
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq50xx|DEVICE_qualcommax_ipq50xx_DEVICE_)' .config || true
          echo '=== KMOD PACKAGES ==='
          grep -E '^CONFIG_PACKAGE_kmod-(nf-conntrack|nf-tproxy|nf-socket|nft-tproxy|nft-socket)=' .config
          echo '=== TPROXY KERNEL CONFIG ==='
          grep -E '^CONFIG_(NF_TPROXY_IPV4|NF_TPROXY_IPV6|NETFILTER_XT_TARGET_TPROXY|NF_SOCKET_IPV4|NF_SOCKET_IPV6|NETFILTER_XT_MATCH_SOCKET|NFT_SOCKET|NFT_TPROXY)=' "$CFG"

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download sources
        run: |
          make download -j$(nproc)
          find dl -type f -size -1024c -print -delete

      - name: Build kernel and TPROXY packages only
        run: |
          set -eux
          make target/compile -j$(nproc) V=s
          make package/kernel/linux/compile -j$(nproc) V=s
          find bin/packages/aarch64_cortex-a53/kernel -maxdepth 1 -type f \
            \( -name 'kmod-nf-*.apk' -o -name 'kmod-nft-*.apk' \) -print | sort

      - name: Verify package metadata
        run: |
          set -eux
          KDIR=bin/packages/aarch64_cortex-a53/kernel
          ls -lh "$KDIR"/kmod-nf-tproxy*.apk "$KDIR"/kmod-nf-socket*.apk \
                 "$KDIR"/kmod-nft-tproxy*.apk "$KDIR"/kmod-nft-socket*.apk
          sha256sum "$KDIR"/kmod-nf-tproxy*.apk "$KDIR"/kmod-nf-socket*.apk \
                    "$KDIR"/kmod-nft-tproxy*.apk "$KDIR"/kmod-nft-socket*.apk

      - name: Upload TPROXY packages
        uses: actions/upload-artifact@v4
        with:
          name: d50-tproxy-kmods-${{ github.sha }}
          path: |
            bin/packages/aarch64_cortex-a53/kernel/kmod-nf-conntrack*.apk
            bin/packages/aarch64_cortex-a53/kernel/kmod-nf-tproxy*.apk
            bin/packages/aarch64_cortex-a53/kernel/kmod-nf-socket*.apk
            bin/packages/aarch64_cortex-a53/kernel/kmod-nft-tproxy*.apk
            bin/packages/aarch64_cortex-a53/kernel/kmod-nft-socket*.apk
          if-no-files-found: error
          retention-days: 14
