name: Refresh D50 kernel patches

on:
  workflow_dispatch:
  push:
    branches:
      - d50-homeproxy-2024031600

permissions:
  contents: write

concurrency:
  group: refresh-kernel-patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget \
            subversion xsltproc time bc bzip2 patch perl

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure D50
        run: |
          cp configs/d50-homeproxy.config .config
          make defconfig
          grep -E '^CONFIG_(TARGET_qualcommax|TARGET_qualcommax_ipq50xx|TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_)' .config

      - name: Download kernel source
        run: |
          make target/linux/download V=s

      - name: Refresh kernel patches
        run: |
          make target/linux/refresh V=s

      - name: Verify refreshed files
        run: |
          echo "=== CHANGED FILES ==="
          git diff --name-only
          echo "=== PATCH DIFF ==="
          git diff -- target/linux/generic/hack-6.12/998-mhi-async.patch
          git diff -- target/linux/generic/hack-6.12/999-mhi-add-rm500q-ae.patch
          git diff -- target/linux/qualcommax/patches-6.12/9999-ipq5018-OC-1.3Ghz.patch
          git diff --name-only | grep -v '^target/linux/generic/hack-6.12/998-mhi-async.patch$' | \
            grep -v '^target/linux/generic/hack-6.12/999-mhi-add-rm500q-ae.patch$' | \
            grep -v '^target/linux/qualcommax/patches-6.12/9999-ipq5018-OC-1.3Ghz.patch$' && \
            { echo "Unexpected files changed"; exit 1; } || true

      - name: Commit refreshed patches
        run: |
          if git diff --quiet -- \
              target/linux/generic/hack-6.12/998-mhi-async.patch \
              target/linux/generic/hack-6.12/999-mhi-add-rm500q-ae.patch \
              target/linux/qualcommax/patches-6.12/9999-ipq5018-OC-1.3Ghz.patch; then
            echo "No patch refresh changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            target/linux/generic/hack-6.12/998-mhi-async.patch \
            target/linux/generic/hack-6.12/999-mhi-add-rm500q-ae.patch \
            target/linux/qualcommax/patches-6.12/9999-ipq5018-OC-1.3Ghz.patch
          git commit -m "Refresh D50 kernel patches for current 6.12"
          git push origin "HEAD:${GITHUB_REF_NAME}"
